name: Poka-Yoke CI/CD Build Gate

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-and-security-gate:
    name: Quality and Security Gate
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python validation tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      # --------------------------------------------------
      # Python Code Format
      # --------------------------------------------------
      - name: Format Python code
        run: |
          black django/

      # --------------------------------------------------
      # Python Formatting
      # --------------------------------------------------
      - name: Check Python formatting
        run: |
          black --check django/

      # --------------------------------------------------
      # Python Linting
      # --------------------------------------------------
      - name: Run Python linter
        run: |
          flake8 django/

      # --------------------------------------------------
      # Terraform
      # --------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform format check
        working-directory: terraform
        run: |
          terraform fmt -check -recursive

      - name: Terraform initialization
        working-directory: terraform
        run: |
          terraform init -backend=false

      - name: Terraform validation
        working-directory: terraform
        run: |
          terraform validate

      # --------------------------------------------------
      # Secret Detection
      # --------------------------------------------------
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # Dependency / Vulnerability Scan
      # --------------------------------------------------
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

      # --------------------------------------------------
      # Build Gate
      # --------------------------------------------------
      - name: Build Gate Passed
        run: |
          echo "All quality and security gates passed."
          echo "Deployment may proceed."
